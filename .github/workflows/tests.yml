name: Tests

on:
  workflow_call:
    inputs:
      validation_ref:
        description: Exact synchronized commit to validate
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ inputs.validation_ref || github.ref }}
  cancel-in-progress: true

jobs:
  plan-tests:
    name: Plan test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout code for path classification
        if: inputs.validation_ref == '' && github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify test scope
        id: classify
        shell: bash
        env:
          VALIDATION_REF: ${{ inputs.validation_ref }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$VALIDATION_REF" ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=exact synchronized revision requires full validation" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual validation requires full coverage" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || \
             ! git cat-file -e "$BASE_SHA^{commit}" || \
             ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=revision range was unavailable; failing safe to full coverage" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -d '' changed < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          if (( ${#changed[@]} == 0 )); then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=no changed paths were reported; failing safe to full coverage" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for path in "${changed[@]}"; do
            if [[ "$path" == docs/* || "$path" == *.md ]]; then
              continue
            fi
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=code or configuration changed" >> "$GITHUB_OUTPUT"
            exit 0
          done
          # Some Markdown-looking paths are executable or generated contracts:
          # skills, website pages and the plugin catalog all have Python tests.
          # Reuse the repository classifier so this shortcut cannot drift from
          # those maintained consumers.
          classifier_output="$RUNNER_TEMP/test-classifier-output"
          printf '%s\n' "${changed[@]}" | \
            GITHUB_OUTPUT="$classifier_output" python3 scripts/ci/classify_changes.py \
            > "$RUNNER_TEMP/test-classifier.log"
          if grep -qx 'python=true' "$classifier_output"; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=documentation path is covered by executable contract tests" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_heavy=false" >> "$GITHUB_OUTPUT"
          echo "reason=all changes are Markdown or under docs/" >> "$GITHUB_OUTPUT"

  acp-regression:
    needs: plan-tests
    if: needs.plan-tests.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false

      - name: Build the locked test environment
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'
          # Explicit test-only SDK coverage; runtime selection is unchanged.
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'

      - name: Run ACP regression suite
        run: |
          scripts/run_tests.sh tests/acp_adapter/test_session.py tests/acp_adapter/test_server.py -- -q
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  test-shards:
    needs: plan-tests
    if: needs.plan-tests.outputs.run_heavy == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slice: [1, 2]
    runs-on: ubuntu-latest
    # Same complete unit inventory, partitioned by the runner across two standard hosts.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Build the locked test environment
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'
          # Explicit test-only SDK coverage; runtime selection is unchanged.
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'

      - name: Run tests
        shell: bash
        run: |
          report_dir="$RUNNER_TEMP/unit-tests-${{ matrix.slice }}"
          mkdir -p "$report_dir"
          set +e
          scripts/run_tests.sh -j 4 --slice "${{ matrix.slice }}/2" --report-json "$report_dir/report.json" \
            tests/ -- -q --ignore=tests/integration --ignore=tests/e2e --tb=short 2>&1 | tee "$report_dir/output.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Preserve shard receipt and retry output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: unit-tests-${{ matrix.slice }}
          path: ${{ runner.temp }}/unit-tests-${{ matrix.slice }}/
          if-no-files-found: error
          retention-days: 7

  # Preserve the original required check name and fail closed on partial runs.
  test:
    needs: [plan-tests, test-shards]
    if: always() && needs.plan-tests.result == 'success' && needs.plan-tests.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false

      - name: Download both unit shard receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: unit-tests-*
          path: ${{ runner.temp }}/unit-test-reports

      - name: Require complete successful unit coverage
        if: always()
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
          EXPECTED_SHA: ${{ inputs.validation_ref || github.sha }}
        run: |
          python3 -m scripts.ci.verify_test_shards \
            --reports "$RUNNER_TEMP/unit-test-reports" --sha "$EXPECTED_SHA" --result "$SHARDS_RESULT"

  e2e:
    needs: plan-tests
    if: needs.plan-tests.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false

      - name: Build the locked test environment
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'
          # Explicit test-only SDK coverage; runtime selection is unchanged.
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'

      - name: Run e2e tests
        run: |
          # Keep the existing adapter/relay smoke scope. New upstream core E2E
          # exercises full installers and desktop builds in dedicated lanes.
          scripts/run_tests.sh --include-integration \
            tests/e2e/test_discord_adapter.py \
            tests/e2e/test_platform_commands.py \
            tests/e2e/test_relay_native_anthropic_stream.py \
            tests/e2e/test_relay_native_openai_stream.py -- -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  validation:
    name: Test validation
    needs: [plan-tests, acp-regression, test-shards, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a truthful complete result
        shell: bash
        env:
          RUN_HEAVY: ${{ needs.plan-tests.outputs.run_heavy }}
          REASON: ${{ needs.plan-tests.outputs.reason }}
          PLAN_RESULT: ${{ needs.plan-tests.result }}
          ACP_RESULT: ${{ needs.acp-regression.result }}
          SHARDS_RESULT: ${{ needs.test-shards.result }}
          UNIT_GATE_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          printf 'Test plan: %s (heavy=%s)\n' "$REASON" "$RUN_HEAVY"
          printf 'Results: plan=%s acp=%s shards=%s unit-gate=%s e2e=%s\n' \
            "$PLAN_RESULT" "$ACP_RESULT" "$SHARDS_RESULT" "$UNIT_GATE_RESULT" "$E2E_RESULT"
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::Test planning did not succeed"
            exit 1
          fi
          results=("$ACP_RESULT" "$SHARDS_RESULT" "$UNIT_GATE_RESULT" "$E2E_RESULT")
          if [[ "$RUN_HEAVY" == "true" ]]; then
            for result in "${results[@]}"; do
              if [[ "$result" != "success" ]]; then
                echo "::error::Selected test coverage did not complete successfully"
                exit 1
              fi
            done
            echo "Full test coverage completed successfully"
            exit 0
          fi
          if [[ "$RUN_HEAVY" == "false" ]]; then
            for result in "${results[@]}"; do
              if [[ "$result" != "skipped" ]]; then
                echo "::error::Documentation-only validation ran an unexpected test job"
                exit 1
              fi
            done
            echo "Full test coverage is intentionally not applicable to this documentation-only change"
            exit 0
          fi
          echo "::error::Test plan did not report whether full coverage was selected"
          exit 1
