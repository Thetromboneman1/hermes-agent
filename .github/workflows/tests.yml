name: Tests

on:
  workflow_call:
    inputs:
      validation_ref:
        description: Exact synchronized commit to validate
        required: true
        type: string
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ inputs.validation_ref || github.ref }}
  cancel-in-progress: true

jobs:
  acp-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false

      - name: Build the locked test environment
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'
          # Explicit test-only SDK coverage; runtime selection is unchanged.
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'

      - name: Run ACP regression suite
        run: |
          scripts/run_tests.sh tests/acp_adapter/test_session.py tests/acp_adapter/test_server.py -- -q
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  test:
    runs-on: ubuntu-latest
    # The fork now runs the full isolated suite (all maintained unit-test files), not only ACP.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Build the locked test environment
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'
          # Explicit test-only SDK coverage; runtime selection is unchanged.
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'

      - name: Run tests
        run: |
          scripts/run_tests.sh tests/ -- -q --ignore=tests/integration --ignore=tests/e2e --tb=short
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false

      - name: Build the locked test environment
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'
          # Explicit test-only SDK coverage; runtime selection is unchanged.
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'

      - name: Run e2e tests
        run: |
          # Keep the existing adapter/relay smoke scope. New upstream core E2E
          # exercises full installers and desktop builds in dedicated lanes.
          scripts/run_tests.sh --include-integration \
            tests/e2e/test_discord_adapter.py \
            tests/e2e/test_platform_commands.py \
            tests/e2e/test_relay_native_anthropic_stream.py \
            tests/e2e/test_relay_native_openai_stream.py -- -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
