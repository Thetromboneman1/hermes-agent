name: Tests

on:
  workflow_call:
    inputs:
      validation_ref:
        description: Exact synchronized commit to validate
        required: true
        type: string
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ inputs.validation_ref || github.ref }}
  cancel-in-progress: true

jobs:
  acp-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11 --seed
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run ACP regression suite
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh tests/acp/test_session.py tests/acp/test_server.py -- -q
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  test:
    runs-on: ubuntu-latest
    # The fork now runs the full isolated suite (4,000+ files), not only ACP.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11 --seed
          source .venv/bin/activate
          # [all] deliberately excludes lazy-installed provider SDKs. Unit tests
          # disable lazy installs, so exercise those integrations with their
          # existing, exact-pinned extras installed before the hermetic runner.
          uv pip install -e ".[all,dev,anthropic,bedrock,daytona,fal,hindsight,modal,parallel-web]"

      - name: Run tests
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh tests/ -- -q --ignore=tests/integration --ignore=tests/e2e --tb=short
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11 --seed
          source .venv/bin/activate
          # Exercise the native Anthropic streaming integration instead of
          # silently import-skipping it when the optional SDK is absent.
          uv pip install -e ".[all,dev,anthropic]"

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh tests/e2e/ -- -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
