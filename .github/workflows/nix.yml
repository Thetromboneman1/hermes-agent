name: Nix

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'hermes_cli/**'
      - 'run_agent.py'
      - 'acp_adapter/**'
      - '.github/actions/nix-setup/**'
      - '.github/workflows/nix.yml'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'hermes_cli/**'
      - 'run_agent.py'
      - 'acp_adapter/**'
      - '.github/actions/nix-setup/**'
      - '.github/workflows/nix.yml'

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A cold Linux flake check can exceed 30 minutes while dependencies build.
    # Keep a bounded timeout, but allow enough headroom for an uncached runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/nix-setup
      - name: Evaluate flake outputs
        if: runner.os == 'Linux'
        # `flake check --no-build` cannot evaluate checks whose derivations
        # reference source paths that have not been materialized yet.
        run: nix flake show --json > /dev/null
      - name: Build minimal package
        if: runner.os == 'Linux'
        # The default package intentionally contains every optional integration.
        # Building that cold exceeded an hour and 64 MiB of runner logs. The
        # regular Tests workflow covers those integrations; this lane verifies
        # the complete flake graph and builds the supported minimal package.
        run: nix build .#minimal --print-build-logs
      - name: Evaluate flake (macOS)
        if: runner.os == 'macOS'
        run: nix flake show --json > /dev/null
