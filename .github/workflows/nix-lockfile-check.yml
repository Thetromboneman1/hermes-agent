name: Nix Lockfile Check

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      validation_ref:
        description: Exact synchronized commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nix-lockfile-check-${{ inputs.validation_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/nix-setup

      # importNpmLock consumes integrity hashes directly from the shared root
      # lockfile. node-gyp has its own tracked lockfile and fixed-output hash.
      # Build both dependency closures: evaluation alone does not verify hashes.
      - name: Verify committed npm dependencies
        run: |
          nix build --no-link --no-update-lock-file --print-build-logs .#tui.npmDeps .#node-gyp.npmDeps
          # A cached fixed-output result alone cannot reveal a stale npmDepsHash.
          nix build --rebuild --no-link --no-update-lock-file --print-build-logs .#node-gyp.npmDeps
