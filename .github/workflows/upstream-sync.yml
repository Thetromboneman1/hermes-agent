name: Sync with NousResearch upstream

on:
  schedule:
    # Daily at 04:00 UTC (midnight US Eastern)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_rebase:
        description: 'Propagate main to custom branches even if unchanged (legacy input name)'
        type: boolean
        default: false

concurrency:
  group: repository-writes-${{ github.repository }}-refs/heads/main
  cancel-in-progress: false

jobs:
  sync-main:
    name: Sync main ← NousResearch/hermes-agent
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      before: ${{ steps.sync.outputs.before }}
      after: ${{ steps.sync.outputs.after }}

    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "Thetromboneman1"
          git config user.email "Thetromboneman1@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream --prune

      - name: Sync main from upstream
        id: sync
        run: |
          git checkout main
          BEFORE=$(git rev-parse HEAD)
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"

          # Preserve fork-only paths and workflows; fail on real product conflicts.
          bash scripts/sync_upstream.sh upstream/main

          # The GITHUB_TOKEN push will not start the documentation self-healer.
          # Refresh only its known generated outputs before validating this SHA.
          python3 scripts/documentation_health.py --write
          if ! git diff --quiet -- README.md docs/REPOSITORY_STATE.md; then
            git add README.md docs/REPOSITORY_STATE.md
            git commit -m "docs: refresh generated repository state [skip ci]"
          fi

          PUSHED=false
          for ATTEMPT in 1 2 3; do
            if git push origin main; then
              PUSHED=true
              break
            fi
            if [ "$ATTEMPT" -eq 3 ]; then
              break
            fi
            echo "Remote main advanced during sync; integrating it before retry $((ATTEMPT + 1))/3"
            git fetch origin main
            git merge --no-edit origin/main
            sleep $((ATTEMPT * 2))
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::Unable to push synchronized main after 3 attempts"
            exit 1
          fi

          AFTER=$(git rev-parse HEAD)
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ main updated: $BEFORE → $AFTER"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  main already up to date"
          fi

  # GITHUB_TOKEN pushes intentionally do not start push-triggered workflows.
  # Call bounded, read-only checks directly and pin every checkout to the output.
  # Validate unchanged syncs too: retrying a failed check must not silently skip it.
  validate-main-tests:
    needs: sync-main
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      validation_ref: ${{ needs.sync-main.outputs.after }}

  validate-main-nix:
    needs: sync-main
    permissions:
      contents: read
    uses: ./.github/workflows/nix.yml
    with:
      validation_ref: ${{ needs.sync-main.outputs.after }}

  validate-main-lockfiles:
    needs: sync-main
    permissions:
      contents: read
    uses: ./.github/workflows/nix-lockfile-check.yml
    with:
      validation_ref: ${{ needs.sync-main.outputs.after }}

  validate-main-docs-site:
    needs: sync-main
    permissions:
      contents: read
    uses: ./.github/workflows/docs-site-checks.yml
    with:
      validation_ref: ${{ needs.sync-main.outputs.after }}

  validate-main-container:
    needs: sync-main
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.sync-main.outputs.after }}
          submodules: recursive
          persist-credentials: false
      - name: Build synchronized image without publishing
        run: docker build --tag hermes-agent:sync-validation .
      - name: Smoke test synchronized image
        run: docker run --rm -v /tmp/hermes-test:/opt/data hermes-agent:sync-validation --help

  validate-main-documentation:
    needs: sync-main
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.sync-main.outputs.after }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install SVG renderer
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Verify generated documentation
        run: python3 scripts/documentation_health.py --check

  rebase-custom-branches:
    name: Merge validated main into local-first-acp-optimizations
    permissions:
      contents: write
      issues: write
    timeout-minutes: 90
    concurrency:
      group: repository-writes-${{ github.repository }}-refs/heads/local-first-acp-optimizations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Do not propagate a failed synchronized revision into the custom overlay.
    needs:
      - sync-main
      - validate-main-tests
      - validate-main-nix
      - validate-main-lockfiles
      - validate-main-docs-site
      - validate-main-container
      - validate-main-documentation
    # Inspect remote ancestry after every successful validation run. A previous
    # custom propagation may have failed even when this run leaves main unchanged.

    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.sync-main.outputs.after }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "Thetromboneman1"
          git config user.email "Thetromboneman1@users.noreply.github.com"

      - name: Preserve validated propagation helper
        run: |
          mkdir -p "$RUNNER_TEMP/custom-sync-tools"
          cp scripts/sync_custom_branch.py scripts/documentation_health.py "$RUNNER_TEMP/custom-sync-tools/"

      - name: Prepare ancestry-preserving custom merge
        id: rebase
        env:
          EXPECTED_MAIN: ${{ needs.sync-main.outputs.after }}
          FORCE_PROPAGATION: ${{ inputs.force_rebase == true }}
          REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="local-first-acp-optimizations"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          REMOTE_CUSTOM=$(git ls-remote --heads origin "refs/heads/$BRANCH")
          if [ -z "$REMOTE_CUSTOM" ]; then
            echo "Branch $BRANCH not found in fork; skipping"
            exit 0
          fi
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          ACTUAL_MAIN=$(git rev-parse refs/remotes/origin/main)
          if [ "$ACTUAL_MAIN" != "$EXPECTED_MAIN" ]; then
            echo "::error::Remote main $ACTUAL_MAIN does not match validated sync output $EXPECTED_MAIN"
            exit 1
          fi
          ORIGINAL_SHA=$(git rev-parse "refs/remotes/origin/$BRANCH")
          echo "original_sha=$ORIGINAL_SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$EXPECTED_MAIN" "$ORIGINAL_SHA"; then
            if [ "$FORCE_PROPAGATION" != "true" ]; then
              echo "Custom branch already contains validated main; skipping backup, build and publication"
              exit 0
            fi
          else
            ANCESTRY_STATUS=$?
            if [ "$ANCESTRY_STATUS" -ne 1 ]; then
              echo "::error::Cannot determine custom branch ancestry"
              exit "$ANCESTRY_STATUS"
            fi
          fi
          BACKUP_BRANCH="automation-backups/${BRANCH}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "backup_branch=$BACKUP_BRANCH" >> "$GITHUB_OUTPUT"
          git push origin "$ORIGINAL_SHA:refs/heads/$BACKUP_BRANCH"
          # Build on a detached HEAD so failed validation cannot move a local branch.
          git checkout --detach "$ORIGINAL_SHA"

          # A rebase would replay the old overlay and discard reviewed merge-only
          # reconciliation. Keep every original ancestor and fail on real conflicts.
          python3 "$RUNNER_TEMP/custom-sync-tools/sync_custom_branch.py" \
            "$EXPECTED_MAIN" --expected-head "$ORIGINAL_SHA"
          AFTER=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$ORIGINAL_SHA" "$AFTER"
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$AFTER"
          test -z "$(git status --porcelain)"
          echo "prepared_sha=$AFTER" >> "$GITHUB_OUTPUT"

      - name: Require custom overlay validation contract
        if: steps.rebase.outputs.prepared_sha != ''
        run: |
          test -x scripts/ci/validate_container_overlay.sh
          test -x scripts/ci/check_container_ssh_image.sh

      - name: Set up custom test environment
        if: steps.rebase.outputs.prepared_sha != ''
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'
          extras: '[]'

      - name: Validate prepared custom overlay
        if: steps.rebase.outputs.prepared_sha != ''
        env:
          PREPARED_SHA: ${{ steps.rebase.outputs.prepared_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PREPARED_SHA"
          test -z "$(git status --porcelain)"
          scripts/ci/validate_container_overlay.sh "$PREPARED_SHA"

      - name: Validate prepared custom documentation
        if: steps.rebase.outputs.prepared_sha != ''
        env:
          REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/documentation_health.py --check

      - name: Build prepared custom image without publishing
        if: steps.rebase.outputs.prepared_sha != ''
        run: docker build --tag hermes-agent:custom-validation .

      - name: Smoke test prepared custom image
        if: steps.rebase.outputs.prepared_sha != ''
        run: docker run --rm --tmpfs /opt/data hermes-agent:custom-validation --help

      - name: Verify prepared custom image SSH policy
        if: steps.rebase.outputs.prepared_sha != ''
        run: scripts/ci/check_container_ssh_image.sh hermes-agent:custom-validation

      - name: Publish validated custom commit
        if: steps.rebase.outputs.prepared_sha != ''
        env:
          EXPECTED_MAIN: ${{ needs.sync-main.outputs.after }}
          ORIGINAL_SHA: ${{ steps.rebase.outputs.original_sha }}
          PREPARED_SHA: ${{ steps.rebase.outputs.prepared_sha }}
          BRANCH: ${{ steps.rebase.outputs.branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$PREPARED_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$ORIGINAL_SHA" "$PREPARED_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$PREPARED_SHA"
          # Recheck both observed heads immediately before publication. A normal
          # push also rejects concurrent divergent custom-branch changes.
          ACTUAL_MAIN=$(git ls-remote --heads origin refs/heads/main | cut -f1)
          ACTUAL_CUSTOM=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$ACTUAL_MAIN" != "$EXPECTED_MAIN" ] || [ "$ACTUAL_CUSTOM" != "$ORIGINAL_SHA" ]; then
            echo "::error::Remote heads changed during propagation; nothing will be published"
            exit 1
          fi
          git push origin "$PREPARED_SHA:refs/heads/$BRANCH"
          echo "Preserved custom history and published $PREPARED_SHA"

      - name: Record custom propagation failure
        if: failure() && steps.rebase.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.rebase.outputs.branch }}
          ORIGINAL_SHA: ${{ steps.rebase.outputs.original_sha }}
          BACKUP_BRANCH: ${{ steps.rebase.outputs.backup_branch }}
          CONFLICTS: ${{ steps.rebase.outputs.conflicts }}
        run: |
          TITLE="Upstream sync conflict: ${BRANCH}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          The ancestry-preserving custom merge, its validation, or its publication failed. The job was intentionally marked failed; inspect the logs and recovery branch before retrying.

          - Branch: \`${BRANCH}\`
          - Original commit: \`${ORIGINAL_SHA:-unknown}\`
          - Recovery branch: \`${BACKUP_BRANCH:-not created}\`
          - Run: ${RUN_URL}

          Conflicting paths or failure detail:

          \`\`\`
          ${CONFLICTS:-See the linked run logs.}
          \`\`\`
          EOF
          )
          {
            echo "## Downstream merge recovery"
            printf '%s\n' "$BODY"
          } >> "$GITHUB_STEP_SUMMARY"

          HAS_ISSUES=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues' \
            2>/dev/null || printf 'false')
          if [ "$HAS_ISSUES" != "true" ]; then
            echo "::warning::Repository Issues are disabled; recovery details remain in the run summary"
            exit 0
          fi

          ISSUE_NUMBER=$(gh issue list --state open --search "${TITLE} in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
