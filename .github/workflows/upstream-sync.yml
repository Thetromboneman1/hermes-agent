name: Sync with NousResearch upstream

on:
  schedule:
    # Daily at 04:00 UTC (midnight US Eastern)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_rebase:
        description: 'Force rebase custom branches even if main unchanged'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: repository-writes-${{ github.repository }}-refs/heads/main
  cancel-in-progress: false

jobs:
  sync-main:
    name: Sync main ← NousResearch/hermes-agent
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      before: ${{ steps.sync.outputs.before }}
      after: ${{ steps.sync.outputs.after }}

    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "Thetromboneman1"
          git config user.email "Thetromboneman1@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream --prune

      - name: Sync main from upstream
        id: sync
        run: |
          git checkout main
          BEFORE=$(git rev-parse HEAD)
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"

          # Save the fork's workflow files before merging
          mkdir -p /tmp/fork-workflows
          cp -r .github/workflows/* /tmp/fork-workflows/ 2>/dev/null || true

          # Prefer fast-forward; fall back to merge commit
          if git merge --ff-only upstream/main; then
            echo "Fast-forward merge succeeded"
          else
            # Use a no-commit merge so we can auto-resolve workflow-only conflicts.
            # Some upstream updates modify workflow files that are fork-customized.
            set +e
            git merge upstream/main --no-commit --no-ff --strategy-option=theirs
            MERGE_STATUS=$?
            set -e

            if [ "$MERGE_STATUS" -ne 0 ]; then
              UNMERGED=$(git diff --name-only --diff-filter=U || true)

              # If conflicts are only in workflows, resolve by restoring fork workflows.
              NON_WORKFLOW_CONFLICTS=$(echo "$UNMERGED" | grep -v '^\.github/workflows/' || true)
              if [ -n "$NON_WORKFLOW_CONFLICTS" ]; then
                echo "::error::Merge conflicts outside .github/workflows detected"
                echo "$NON_WORKFLOW_CONFLICTS"
                git merge --abort
                exit 1
              fi

              git rm -rf --ignore-unmatch .github/workflows/*
              mkdir -p .github/workflows
              cp -r /tmp/fork-workflows/. .github/workflows/ 2>/dev/null || true
              git add .github/workflows/
            fi

            git commit --no-edit
            echo "Created merge commit (non-fast-forward)"
          fi

          # Restore fork's workflow files to prevent GitHub App restriction
          # (GitHub won't allow GITHUB_TOKEN to modify workflow files)
          if [ -d /tmp/fork-workflows ] && [ "$(ls -A /tmp/fork-workflows)" ]; then
            rm -rf .github/workflows/*
            cp /tmp/fork-workflows/* .github/workflows/
            if ! git diff --quiet .github/workflows/; then
              git add .github/workflows/
              git commit --amend --no-edit || true
            fi
          fi

          PUSHED=false
          for ATTEMPT in 1 2 3; do
            if git push origin main; then
              PUSHED=true
              break
            fi
            if [ "$ATTEMPT" -eq 3 ]; then
              break
            fi
            echo "Remote main advanced during sync; integrating it before retry $((ATTEMPT + 1))/3"
            git fetch origin main
            git merge --no-edit origin/main
            sleep $((ATTEMPT * 2))
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::Unable to push synchronized main after 3 attempts"
            exit 1
          fi

          AFTER=$(git rev-parse HEAD)
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ main updated: $BEFORE → $AFTER"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  main already up to date"
          fi

  rebase-custom-branches:
    name: Rebase local-first-acp-optimizations
    runs-on: ubuntu-latest
    needs: sync-main
    if: needs.sync-main.outputs.changed == 'true' || inputs.force_rebase == true

    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "Thetromboneman1"
          git config user.email "Thetromboneman1@users.noreply.github.com"

      - name: Rebase local-first-acp-optimizations onto updated main
        id: rebase
        env:
          EXPECTED_MAIN: ${{ needs.sync-main.outputs.after }}
        run: |
          BRANCH="local-first-acp-optimizations"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          # Check branch exists in fork
          if ! git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "ℹ️  Branch $BRANCH not found in fork — skipping"
            exit 0
          fi
          # actions/checkout starts this dependent job at the workflow's
          # original SHA. Refresh both refs so the rebase targets the commit
          # produced by sync-main rather than that stale checkout.
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          ACTUAL_MAIN=$(git rev-parse refs/remotes/origin/main)
          if [ "$ACTUAL_MAIN" != "$EXPECTED_MAIN" ]; then
            echo "::error::Remote main $ACTUAL_MAIN does not match sync output $EXPECTED_MAIN"
            exit 1
          fi
          git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
          ORIGINAL_SHA=$(git rev-parse HEAD)
          BACKUP_BRANCH="automation-backups/${BRANCH}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "original_sha=$ORIGINAL_SHA" >> "$GITHUB_OUTPUT"
          echo "backup_branch=$BACKUP_BRANCH" >> "$GITHUB_OUTPUT"
          git push origin "$ORIGINAL_SHA:refs/heads/$BACKUP_BRANCH"

          REBASE_OK=false
          if git rebase "refs/remotes/origin/main"; then
            REBASE_OK=true
          else
            # Generated repository fingerprints are branch-specific and may
            # conflict after main advances. Resolve only those two known files
            # in favor of the new base; never auto-resolve product/config files.
            DOC_CONFLICT_ATTEMPTS=0
            while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
              DOC_CONFLICT_ATTEMPTS=$((DOC_CONFLICT_ATTEMPTS + 1))
              if [ "$DOC_CONFLICT_ATTEMPTS" -gt 5 ]; then
                echo "::error::Generated-documentation conflict retry limit exceeded"
                break
              fi
              CONFLICTS=$(git diff --name-only --diff-filter=U || true)
              NON_GENERATED=$(printf '%s\n' "$CONFLICTS" | \
                grep -Ev '^(README\.md|docs/REPOSITORY_STATE\.md)$' || true)
              if [ -z "$CONFLICTS" ] || [ -n "$NON_GENERATED" ]; then
                break
              fi
              echo "Resolving generated-documentation conflicts against updated main"
              git checkout --ours -- README.md docs/REPOSITORY_STATE.md
              git add README.md docs/REPOSITORY_STATE.md
              if git diff --cached --quiet; then
                git rebase --skip || break
              else
                GIT_EDITOR=true git rebase --continue || true
              fi
            done
            if [ ! -d .git/rebase-merge ] && [ ! -d .git/rebase-apply ] && \
              git merge-base --is-ancestor "refs/remotes/origin/main" HEAD; then
              REBASE_OK=true
            fi
          fi

          if [ "$REBASE_OK" = "true" ]; then
            python3 scripts/documentation_health.py --write
            if ! git diff --quiet -- README.md docs/REPOSITORY_STATE.md; then
              git add README.md docs/REPOSITORY_STATE.md
              git commit -m "docs: refresh generated repository state [skip ci]"
            fi
          fi

          if [ "$REBASE_OK" = "true" ] && git push origin "$BRANCH" \
            --force-with-lease="refs/heads/$BRANCH:$ORIGINAL_SHA"; then
            echo "✅ $BRANCH rebased and pushed"
          else
            CONFLICTS=$(git diff --name-only --diff-filter=U || true)
            {
              echo "conflicts<<EOF"
              printf '%s\n' "${CONFLICTS:-No unmerged paths were reported; inspect the push and rebase logs.}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git rebase --abort || true
            echo "::error::Rebase or protected push failed on $BRANCH — manual intervention needed"
            exit 1
          fi

      - name: Record rebase failure
        if: failure() && steps.rebase.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.rebase.outputs.branch }}
          ORIGINAL_SHA: ${{ steps.rebase.outputs.original_sha }}
          BACKUP_BRANCH: ${{ steps.rebase.outputs.backup_branch }}
          CONFLICTS: ${{ steps.rebase.outputs.conflicts }}
        run: |
          TITLE="Upstream sync conflict: ${BRANCH}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          The automated rebase failed and the job was intentionally marked failed.

          - Branch: \`${BRANCH}\`
          - Original commit: \`${ORIGINAL_SHA:-unknown}\`
          - Recovery branch: \`${BACKUP_BRANCH:-not created}\`
          - Run: ${RUN_URL}

          Conflicting paths or failure detail:

          \`\`\`
          ${CONFLICTS:-See the linked run logs.}
          \`\`\`
          EOF
          )
          {
            echo "## Downstream rebase recovery"
            printf '%s\n' "$BODY"
          } >> "$GITHUB_STEP_SUMMARY"

          HAS_ISSUES=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues' \
            2>/dev/null || printf 'false')
          if [ "$HAS_ISSUES" != "true" ]; then
            echo "::warning::Repository Issues are disabled; recovery details remain in the run summary"
            exit 0
          fi

          ISSUE_NUMBER=$(gh issue list --state open --search "${TITLE} in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
