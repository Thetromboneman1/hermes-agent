name: Docs Site Checks

on:
  workflow_call:
    inputs:
      validation_ref:
        description: Exact synchronized commit to validate
        required: true
        type: string
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs-site-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.validation_ref || github.sha }}
          persist-credentials: false

      - name: Set up the locked site toolchain
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          node-cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Install isolated documentation tools
        run: python -m scripts.ci.python_packages ascii-guard==2.3.0 ruamel.yaml==0.18.17

      - name: Extract skill metadata for dashboard
        run: python3 website/scripts/extract-skills.py

      - name: Lint docs diagrams
        run: npm run lint:diagrams
        working-directory: website

      - name: Build Docusaurus
        # Bound minifier workers instead of scaling memory use with host CPUs.
        env:
          TERSER_PARALLEL: '2'
        run: npm run build
        working-directory: website
